<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Bootstrap - Estructura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container my-5">
        <h1>Bienvenidos al Taller</h1>

        <div class="row">
            <div class="col-12 col-md-6 border">Columna 1 (100% móvil / 50% desktop)</div>
            <div class="col-12 col-md-6 border">Columna 2 (100% móvil / 50% desktop)</div>
        </div>

        <h2 class="mt-4">Tabla de Datos</h2>
        <table class="table table-striped table-hover border-primary">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Rol</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Usuario A</td>
                    <td>Desarrollador</td>
                </tr>
            </tbody>
        </table>

        <button class="btn btn-primary custom-btn">Botón con Estilo Propio</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
